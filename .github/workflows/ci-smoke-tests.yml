name: CI Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Nextflow
        env:
          NXF_VER: "24.10.5"
        run: |
          curl -s https://get.nextflow.io | bash
          mkdir -p "$HOME/bin"
          mv nextflow "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Java, Nextflow, and Docker
        run: |
          java -version
          nextflow -version
          docker --version

      - name: Build Docker image for CI
        run: |
          docker build -f containers/Dockerfile -t byegenoqc-ci:test .

      - name: Run SNP array smoke test (variant-only)
        env:
          GENETIC_QC_DOCKER_IMAGE: byegenoqc-ci:test
        run: bash test_data/run_smoke_tests.sh --test snp_array

      - name: Run SNP array smoke test (full QC)
        env:
          GENETIC_QC_DOCKER_IMAGE: byegenoqc-ci:test
        run: bash test_data/run_smoke_tests.sh --test snp_full

      - name: Run WGS/WES smoke test
        env:
          GENETIC_QC_DOCKER_IMAGE: byegenoqc-ci:test
        run: bash test_data/run_smoke_tests.sh --test wgs_wes

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            results/
            .nextflow.log
            .nextflow/
          if-no-files-found: ignore

      - name: Success summary
        if: success()
        run: |
          echo "✅ All smoke tests passed"
          echo "  - SNP array variant-only test: PASS"
          echo "  - SNP array full QC test: PASS"
          echo "  - WGS/WES variant-only test: PASS"
